# Flowlet CI: type checking and tests.
#
# Tests need PostgreSQL (the postgres service below) and MongoDB.
# MongoDB is not a service here on purpose: the test setup
# (backend/test/setup.ts) starts its own in-memory mongod via
# mongodb-memory-server, the same route used locally.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowlet
          POSTGRES_PASSWORD: flowlet_dev
          POSTGRES_DB: flowlet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flowlet -d flowlet_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://flowlet:flowlet_dev@localhost:5432/flowlet_test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check (backend + frontend)
        run: bun run typecheck

      - name: Tests
        run: bun run test
